name: CI/CD

# The caller, and deliberately nothing else: triggers plus the import. All real
# config is the repo-root hanzo.yml, which platform.hanzo.ai reads too.
#
# `.hanzo/workflows`, NOT `.github/workflows`, and the difference is whether
# anything runs at all:
#
#   * github.com has ZERO self-hosted runners for this org, so a job asking for
#     `hanzo-build-linux-amd64` there is never claimed. An unclaimable job does
#     not fail — it waits out the 24h timeout while the next push queues behind
#     it. Silence, not an error.
#   * The `git-runner` StatefulSet registers against the FORGE only
#     (GIT_INSTANCE_URL=http://hanzo-git.hanzo.svc), and that is the pool which
#     actually advertises that label.
#
# The `uses:` path names .hanzo/workflows for the same reason: reusables resolve
# through ResolveUses, which enforces the WORKFLOW_DIRS allowlist on the
# referenced path too. hanzoai/ci publishes build.yml at both paths from the
# same tag, so this is the same pipeline at the same @v1.

on:
  push:
    branches: [main]
    # A `v*` tag is a RELEASE and publishes an image named after it, verbatim.
    # Without this, `git tag` publishes nothing and this image carries no
    # version — only the derived patch a branch build mints.
    tags: ['v*']
  workflow_dispatch:

# No `pull_request:`. github.com/hanzoai/lsp is UPSTREAM and git.hanzo.ai holds
# a pull mirror, which is read-only — no PR ever opens on the plane that can run
# this. A trigger nothing can fire reads as coverage this repo does not have.

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cicd:
    uses: hanzoai/ci/.hanzo/workflows/build.yml@v1
    secrets: inherit
